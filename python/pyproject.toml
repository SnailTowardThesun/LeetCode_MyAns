[project]
name = "leetcode-py"
version = "0.1.0"
description = "LeetCode Python 题解（uv 管理，pytest + ruff）"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leetcode_common"]

# 每日一题、Top 150 和 Hot 100 均参与默认测试，模板 _template.py 不收集
[tool.pytest.ini_options]
testpaths = ["questions", "top150", "hot100"]
python_files = ["[0-9]*.py", "test_*.py", "top150_*.py", "hot100_*.py"]
addopts = "--import-mode=importlib -q"

# 行宽 120、4 空格缩进，与 C++ (.clang-format) / Rust 仓库惯例保持一致
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
